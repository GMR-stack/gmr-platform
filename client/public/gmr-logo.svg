<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim-glow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="95%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outer-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="main-clip">
      <circle cx="128" cy="128" r="120"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="126" fill="#060e1e"/>
  <circle cx="128" cy="128" r="122" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#outer-glow)"/>
  <circle cx="128" cy="128" r="120" fill="url(#bg-grad)"/>
  <circle cx="128" cy="128" r="120" fill="url(#glow-center)"/>
  <circle cx="128" cy="128" r="120" fill="url(#rim-glow)"/>

  <g clip-path="url(#main-clip)" filter="url(#line-glow)">
    <circle cx="128" cy="128" r="24" stroke="#3b82f6" stroke-width="0.6" fill="none" opacity="0.3"/>
    <circle cx="128" cy="128" r="48" stroke="#3b82f6" stroke-width="0.6" fill="none" opacity="0.28"/>
    <circle cx="128" cy="128" r="72" stroke="#3b82f6" stroke-width="0.6" fill="none" opacity="0.22"/>
    <circle cx="128" cy="128" r="96" stroke="#3b82f6" stroke-width="0.6" fill="none" opacity="0.18"/>
    <circle cx="128" cy="128" r="116" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.12"/>

    <ellipse cx="128" cy="128" rx="40" ry="120" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.2"/>
    <ellipse cx="128" cy="128" rx="75" ry="120" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.18"/>
    <ellipse cx="128" cy="128" rx="105" ry="120" stroke="#3b82f6" stroke-width="0.5" fill="none" opacity="0.12"/>

    <line x1="8" y1="128" x2="248" y2="128" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
    <line x1="128" y1="8" x2="128" y2="248" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>

    <line x1="128" y1="128" x2="43" y2="43" stroke="#3b82f6" stroke-width="0.4" opacity="0.1"/>
    <line x1="128" y1="128" x2="213" y2="43" stroke="#3b82f6" stroke-width="0.4" opacity="0.1"/>
    <line x1="128" y1="128" x2="43" y2="213" stroke="#3b82f6" stroke-width="0.4" opacity="0.1"/>
    <line x1="128" y1="128" x2="213" y2="213" stroke="#3b82f6" stroke-width="0.4" opacity="0.1"/>

    <line x1="8" y1="80" x2="248" y2="80" stroke="#3b82f6" stroke-width="0.35" opacity="0.1"/>
    <line x1="8" y1="176" x2="248" y2="176" stroke="#3b82f6" stroke-width="0.35" opacity="0.1"/>
  </g>

  <g clip-path="url(#main-clip)">
    <path d="M128,128 L128,8 A120,120 0 0,1 231,65 Z" fill="#3b82f6" opacity="0.06">
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="8s" repeatCount="indefinite"/>
    </path>
    <line x1="128" y1="128" x2="128" y2="12" stroke="#60a5fa" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <g opacity="0.5">
    <circle cx="90" cy="72" r="2.5" fill="#60a5fa" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="95" r="2" fill="#60a5fa" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="165" r="1.8" fill="#60a5fa" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="150" r="2.2" fill="#60a5fa" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="140" r="1.5" fill="#60a5fa" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="128" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" fill="#e0edff" letter-spacing="5" filter="url(#text-glow)" dominant-baseline="central">GMR</text>

  <circle cx="128" cy="128" r="121" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.35"/>
  <circle cx="128" cy="128" r="118" stroke="#1e3a8a" stroke-width="0.5" fill="none" opacity="0.4"/>
</svg>
